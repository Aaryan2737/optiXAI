name: Build Android Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Run all shell commands inside the Flutter project directory
    defaults:
      run:
        working-directory: optixai_mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release (Universal & Per-ABI)
        run: |
          flutter build apk --release --android-skip-build-dependency-validation
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: optixai-release-apks
          path: optixai_mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
